<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>生日网页音乐试听</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:38px 18px;font-family:"PingFang SC",sans-serif;color:#52283b;background:linear-gradient(150deg,#fff8fb,#ffdbe9)}
    main{max-width:560px;margin:auto}h1{text-align:center;color:#ff2f7d;margin:0 0 8px}.sub{text-align:center;color:#895d70;margin:0 0 28px;line-height:1.6}
    .song{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:13px;margin:13px 0;padding:17px;border:1px solid #fff;background:#ffffffc9;border-radius:22px;box-shadow:0 12px 30px #8f36591b}
    .icon{width:52px;height:52px;display:grid;place-items:center;border-radius:16px;background:linear-gradient(145deg,#ff4d90,#ff96ba);font-size:25px}.song h2{font-size:18px;margin:0 0 5px}.song p{font-size:13px;color:#895d70;margin:0;line-height:1.45}
    button{border:0;min-width:68px;padding:11px 13px;border-radius:999px;color:#fff;background:#ff2f7d;font-weight:800}button.playing{background:#6d4054}
    .note{text-align:center;margin-top:26px;font-size:12px;color:#916176;line-height:1.7}
  </style>
</head>
<body><main><h1>选一首生日网页音乐</h1><p class="sub">三段都是原创纯音乐，点击即可试听。选好后告诉我编号。</p>
  <article class="song"><div class="icon">☀️</div><div><h2>1. 阳光汽水</h2><p>明亮、轻快，像一起出发旅行</p></div><button onclick="playSong(1,this)">试听</button></article>
  <article class="song"><div class="icon">💗</div><div><h2>2. 粉色旅行</h2><p>甜甜的浪漫感，温柔但不慢</p></div><button onclick="playSong(2,this)">试听</button></article>
  <article class="song"><div class="icon">🎉</div><div><h2>3. 心动派对</h2><p>更活泼、更有生日庆祝气氛</p></div><button onclick="playSong(3,this)">试听</button></article>
  <p class="note">手机浏览器需要先点击“试听”才会播放声音。再次点击当前按钮可以停止。</p>
</main><script>
  let ctx,timer,current=0;
  const songs={
    1:[[523,.28],[659,.28],[784,.56],[659,.28],[698,.28],[784,.56],[880,.28],[784,.28],[659,.56],[587,.28],[659,.28],[698,.56],[659,.28],[587,.28],[523,.8]],
    2:[[440,.4],[523,.4],[659,.8],[587,.4],[523,.4],[494,.8],[440,.4],[494,.4],[587,.8],[659,.4],[587,.4],[523,1],[494,.4],[523,.4],[440,1]],
    3:[[523,.22],[523,.22],[659,.22],[784,.44],[659,.22],[880,.22],[784,.44],[698,.22],[659,.22],[587,.44],[659,.22],[698,.22],[784,.44],[988,.22],[880,.22],[784,.7]]
  };
  function stop(){clearInterval(timer);if(ctx)ctx.close();ctx=null;current=0;document.querySelectorAll('button').forEach(b=>{b.textContent='试听';b.classList.remove('playing')})}
  function playSong(id,button){if(current===id){stop();return}stop();current=id;ctx=new(window.AudioContext||window.webkitAudioContext)();button.textContent='停止';button.classList.add('playing');schedule(id);const length=songs[id].reduce((s,n)=>s+n[1],0);timer=setInterval(()=>schedule(id),(length+.35)*1000)}
  function schedule(id){let t=ctx.currentTime+.05;songs[id].forEach(([f,d],i)=>{tone(f,d,t,'triangle',.11);if(i%2===0)tone(f/2,d*1.9,t,'sine',.035);t+=d})}
  function tone(f,d,t,type,volume){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(volume,t+.04);g.gain.exponentialRampToValueAtTime(.001,t+d*.9);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+d)}
</script></body></html>
